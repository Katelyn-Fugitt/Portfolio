<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Kate Fugitt Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="login-page">
  <main class="login-screen">
    <section class="window login-box">
      <div class="window-bar">
        <h1>Portfolio Login</h1>
      </div>

      <div class="window-content">
        <p>Please log in to enter Kate Fugitt’s portfolio.</p>

        <label for="username">Username</label>
        <input type="text" id="username">

        <label for="password">Password</label>
        <input type="password" id="password">

        <button id="loginButton">Enter</button>
        <p id="loginMessage">Hint: Username is Kate.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop | Kate Fugitt Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="images/favicon.png">
</head>

<body class="desktop-page protected">
  <main class="desktop">

    <section class="sticky-note">
      <h1>Kate Fugitt Portfolio</h1>
    </section>

    <section class="desktop-icons" aria-label="Portfolio icons">
      <a class="desktop-icon" href="projects.html">
        <img src="images/icon-folder.png" width="64" height="64" alt="Folder icon">
        <span>Projects</span>
      </a>

      <button class="desktop-icon" id="gearIcon">
  <img src="images/icon-gear.png" width="64" height="64" alt="Gear icon">
  <span>Settings</span>
</button>

      <a class="desktop-icon" href="reel.html">
        <img src="images/icon-cd.png" width="64" height="64" alt="CD icon">
        <span>Sizzle Reel</span>
      </a>

      <a class="desktop-icon" href="contact.html">
        <img src="images/icon-mail.png" width="64" height="64" alt="Mail icon">
        <span>Contact</span>
      </a>

      <a class="desktop-icon" href="about.html">
        <img src="images/icon-notepad.png" width="64" height="64" alt="Notepad icon">
        <span>About</span>
      </a>
      <button class="desktop-icon" id="cameraIcon">
         <img src="images/icon-camera.png" width="64" height="64" alt="Camera icon">
          <span>Headshot</span>
        </button>

<button class="desktop-icon" id="trashIcon">
  <img src="images/icon-trash.png" width="64" height="64" alt="Trash icon">
  <span>Trash</span>
</button>

<button class="desktop-icon" id="filmIcon">
  <img src="images/icon-film.png" width="64" height="64" alt="Film icon">
  <span>Random Video</span>
</button>
    </section>
    <section id="desktopPopupArea"></section>
    <section class="window accessibility-window" id="accessibilityWindow">
      <div class="window-bar">
        <h2>Accessibility</h2>
        <div>
          <button class="expand-window" data-target="accessibilityWindow">□</button>
          <button class="close-window" data-target="accessibilityWindow">X</button>
        </div>
      </div>

      <div class="window-content">
        <button id="fontButton">Change Font</button>

        <label for="fontSlider">Text Size</label>
        <input type="range" id="fontSlider" min="14" max="24" value="16">
      </div>
      <h3>Wallpaper</h3>

<div class="wallpaper-options">
  <button class="wallpaper-choice" data-wallpaper="wallpaper-1">
    <img src="images/wallpaper-1.jpg" width="80" height="45" alt="Green hill wallpaper">
  </button>

  <button class="wallpaper-choice" data-wallpaper="wallpaper-2">
    <img src="images/wallpaper-2.jpg" width="80" height="45" alt="Retro teal wallpaper">
  </button>

  <button class="wallpaper-choice" data-wallpaper="wallpaper-3">
    <img src="images/wallpaper-3.jpg" width="80" height="45" alt="Pixel forest wallpaper">
  </button>

  <button class="wallpaper-choice" data-wallpaper="wallpaper-4">
    <img src="images/wallpaper-4.jpg" width="80" height="45" alt="Gray computer wallpaper">
  </button>
</div>
<div class="advanced-accessibility">
  <div class="advanced-accessibility">
  <h3>Accent Color</h3>

  <div class="accent-options">
    <button class="accent-choice" data-accent="accent-grey">
      <span class="accent-preview grey-preview"></span>
      Grey
    </button>

    <button class="accent-choice" data-accent="accent-black">
      <span class="accent-preview black-preview"></span>
      Black
    </button>

    <button class="accent-choice" data-accent="accent-white">
      <span class="accent-preview white-preview"></span>
      White
    </button>
  </div>

  <h3>Cursor</h3>

  <div class="cursor-options">
    <button class="cursor-choice" data-cursor="">
      Default
    </button>

    <button class="cursor-choice" data-cursor="cursor-crosshair">
      Crosshair +
    </button>

    <button class="cursor-choice" data-cursor="cursor-help">
      Help ?
    </button>

    <button class="cursor-choice" data-cursor="cursor-grab">
      Grab ✋
    </button>
  </div>

  <div class="reset-area">
    <button id="resetSettingsButton">Reset Settings</button>
  </div>
</div>
    </section>

  </main>

  
  <footer class="taskbar">
  <button id="menuButton">Menu</button>

  <nav id="startMenu" class="start-menu">
    <a href="desktop.html">
      <img src="images/icon-home.png" width="18" height="18" alt="">
      Home
    </a>

    <a href="about.html">
      <img src="images/icon-notepad.png" width="18" height="18" alt="">
      About
    </a>

    <a href="projects.html">
      <img src="images/icon-folder.png" width="18" height="18" alt="">
      Projects
    </a>

    <a href="reel.html">
      <img src="images/icon-cd.png" width="18" height="18" alt="">
      Sizzle Reel
    </a>

    <a href="contact.html">
      <img src="images/icon-mail.png" width="18" height="18" alt="">
      Contact
    </a>

    <button id="logoutButton">
      <img src="images/icon-power.png" width="18" height="18" alt="">
      Log Out
    </button>
  </nav>

  <p id="clock">5:11 PM</p>
</footer>

  <script src="script.js"></script>
</body>
</html>
